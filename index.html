<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg:        #0d3b35;
  --bg2:       #0a2e29;
  --card:      #124840;
  --card-alt:  #0f3d36;
  --gold:      #f5a623;
  --gold-dim:  #c4831a;
  --teal:      #4ecdc4;
  --teal-dim:  #2eada5;
  --white:     #ffffff;
  --white70:   rgba(255,255,255,0.70);
  --white40:   rgba(255,255,255,0.40);
  --white15:   rgba(255,255,255,0.10);
  --active-border: #f5a623;
  --next-card: #0e4a42;
  --shadow:    0 4px 20px rgba(0,0,0,0.35);
}

body {
  font-family: 'Outfit', sans-serif;
  background: #071f1c;
  color: var(--white);
  min-height: 100vh;
  overflow-x: hidden;
  display: flex;
  justify-content: center;
}

.app-wrapper {
  width: 100%;
  max-width: 430px;
  min-height: 100vh;
  background: var(--bg2);
  position: relative;
  box-shadow: 0 0 60px rgba(0,0,0,0.6);
}

/* ── TOP HEADER ── */
.top-header {
  background: var(--bg);
  padding: 18px 20px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid var(--white15);
}
.header-left { display: flex; align-items: center; gap: 12px; }
.header-icon { font-size: 32px; line-height: 1; }
.header-title { font-size: 18px; font-weight: 700; color: var(--white); line-height: 1.2; }
.header-sub { font-size: 12px; color: var(--gold); font-weight: 500; margin-top: 1px; }
.header-btns { display: flex; gap: 10px; }
.hdr-btn {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1.5px solid var(--white40);
  background: var(--white15);
  color: var(--white);
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.hdr-btn.on { border-color: var(--gold); background: rgba(245,166,35,0.15); color: var(--gold); }

/* ── DATE CARD ── */
.date-card {
  background: var(--bg);
  padding: 28px 20px 24px;
  text-align: center;
  border-bottom: 1px solid var(--white15);
}
.day-name { font-size: 16px; font-weight: 600; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; }
.date-greg { font-size: 34px; font-weight: 800; color: var(--white); line-height: 1.1; letter-spacing: -0.5px; }
.date-hijri { font-family: 'Amiri', serif; font-size: 20px; color: var(--teal); margin-top: 6px; font-weight: 700; }
.clock-row { margin-top: 18px; border-top: 1px solid var(--white15); padding-top: 16px; }
.clock-label { font-size: 12px; color: var(--white40); text-transform: uppercase; letter-spacing: 3px; margin-bottom: 6px; }
.clock { font-size: 58px; font-weight: 800; color: var(--white); letter-spacing: 3px; font-variant-numeric: tabular-nums; line-height: 1; text-shadow: 0 0 40px rgba(255,255,255,0.15); }

/* ── NEXT PRAYER CARD ── */
.next-card {
  background: var(--next-card);
  margin: 16px 14px 0;
  border-radius: 20px;
  padding: 22px 24px;
  border: 1.5px solid rgba(78,205,196,0.3);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  animation: glow 3s ease-in-out infinite;
}
@keyframes glow {
  0%,100% { border-color: rgba(78,205,196,0.25); }
  50%      { border-color: rgba(78,205,196,0.55); }
}
.next-label { font-size: 12px; color: var(--white40); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; }
.next-name  { font-size: 32px; font-weight: 800; color: var(--gold); line-height: 1; }
.next-time  { font-size: 18px; color: var(--white70); margin-top: 4px; font-weight: 500; }
.countdown  { font-size: 38px; font-weight: 800; color: var(--teal); font-variant-numeric: tabular-nums; text-align: right; line-height: 1; text-shadow: 0 0 30px rgba(78,205,196,0.3); }
.cd-label   { font-size: 11px; color: var(--white40); text-align: right; margin-top: 4px; text-transform: uppercase; letter-spacing: 1.5px; }

/* ── TABS ── */
.tabs {
  display: flex;
  gap: 8px;
  padding: 14px 14px 0;
}
.tab-btn {
  flex: 1;
  padding: 11px 6px;
  border-radius: 50px;
  border: 1.5px solid var(--white15);
  background: transparent;
  color: var(--white70);
  font-family: 'Outfit', sans-serif;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}
.tab-btn.active {
  background: var(--gold);
  border-color: var(--gold);
  color: #1a1a1a;
  font-weight: 700;
}

/* ── PRAYER LIST ── */
.prayer-list { padding: 10px 14px 0; display: flex; flex-direction: column; gap: 8px; }

.prayer-card {
  background: var(--card);
  border-radius: 16px;
  padding: 16px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 1.5px solid transparent;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}
.prayer-card.active-prayer {
  background: var(--card-alt);
  border-color: var(--gold);
}
.prayer-card.dim-card {
  background: rgba(18,72,64,0.6);
  opacity: 0.8;
}

.p-left { display: flex; align-items: center; gap: 14px; }
.p-icon {
  width: 48px; height: 48px;
  border-radius: 14px;
  background: var(--white15);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
  flex-shrink: 0;

.prayer-card.dim-card .p-icon { background: rgba(255,255,255,0.05); }

.p-name { font-size: 19px; font-weight: 700; color: var(--white); }
.prayer-card.active-prayer .p-name { color: var(--gold); }
.prayer-card.dim-card .p-name { color: var(--white70); font-size: 17px; }
.p-desc { font-size: 12px; color: var(--white40); margin-top: 2px; }

.p-right { display: flex; align-items: center; gap: 10px; }
.p-time {
  font-size: 22px; font-weight: 700;
  color: var(--white);

  text-align: right;

.prayer-card.active-prayer .p-time { color: var(--gold); font-size: 24px; }
.prayer-card.dim-card .p-time { font-size: 19px; color: var(--white70); }

  background: var(--gold);
  color: #1a1a1a;
  padding: 2px 8px;
  border-radius: 20px;
  letter-spacing: 1px;
  display: block;
  margin-top: 4px;
  text-align: center;

table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 480px; }

th:first-child, td:first-child { text-align: left; padding-left: 14px; }

  font-size: 13px;

  white-space: nowrap;

.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

function showToast(msg, duration=3000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

function format12h(timeStr) {
  if (!timeStr) return '--:--';
  const [h, m] = timeStr.split(':').map(Number);
  const ampm = h < 12 ? 'AM' : 'PM';
  const h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
  return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
}

function timeToMinutes(timeStr) {
  if (!timeStr) return 0;
  const [h, m, s] = timeStr.split(':').map(Number);
  return h * 60 + m + (s||0)/60;
}

function padZ(n) { return String(n).padStart(2,'0'); }

function formatCountdown(ms) {
  if (ms < 0) ms = 0;
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return `${padZ(h)}:${padZ(m)}:${padZ(s)}`;
}

function getHijriDate(date) {
  try {
    const opts = { calendar: 'islamic', year: 'numeric', month: 'long', day: 'numeric' };
    return new Intl.DateTimeFormat('ms-MY-u-ca-islamic', opts).format(date);
  } catch {
    // fallback approximate
    const jd = Math.floor(date.getTime() / 86400000) + 2440588;
    const l = jd - 1948440 + 10632;
    const n = Math.floor((l - 1) / 10631);
    const ll = l - 10631 * n + 354;
    const j = Math.floor((10985 - ll) / 5316) * Math.floor((50 * ll) / 17719) + Math.floor(ll / 5670) * Math.floor((43 * ll) / 15238);
    const lll = ll - Math.floor((30 - j) / 15) * Math.floor((17719 * j) / 50) - Math.floor(j / 16) * Math.floor((15238 * j) / 43) + 29;
    const month = Math.floor((24 * lll) / 709);
    const day = lll - Math.floor((709 * month) / 24);
    const year = 30 * n + j - 30;
    const hMonths = ['Muharam','Safar','Rabiulawal','Rabiulakhir','Jamadilawal','Jamadilakhir','Rejab','Syaaban','Ramadan','Syawal','Zulkaedah','Zulhijah'];
    return `${day} ${hMonths[month-1] || ''} ${year}H`;
  }
}

function parseJakimTime(t) {
  // t = "6:07" → "06:07:00"
  if (!t) return null;
  const [h,m] = t.split(':').map(Number);
  return `${padZ(h)}:${padZ(m)}:00`;
}

const HIJRI_MONTHS_FULL = {
  'Muh':'Muharram','Saf':'Safar','Raw':'Rabiulawal','Rak':'Rabiulakhir',
  'Jaw':'Jamadilawal','Jak':'Jamadilakhir','Rej':'Rejab','Syb':'Syaaban',
  'Ram':'Ramadan','Syw':'Syawal','Zkh':'Zulkaedah','Zhj':'Zulhijah'
};
function expandHijri(h) {
  if (!h) return h;
  return h.replace(/-(Muh|Saf|Raw|Rak|Jaw|Jak|Rej|Syb|Ram|Syw|Zkh|Zhj)-/, (m, abbr) => '-' + (HIJRI_MONTHS_FULL[abbr]||abbr) + '-');
}
function buildPrayerData() {
  return JAKIM_RAW.map((row, i) => {
    const [dateStr, hijri, imsak, fajr, syuruk, dhuhr, asr, maghrib, isha] = row;
    const parts = dateStr.split('-');
    const day = parseInt(parts[0]);
    const month = parseInt(['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].indexOf(parts[1]) + 1);
    const year = parseInt(parts[2]);
    const dateObj = new Date(year, month-1, day);
    return {
      date: dateStr,
      hijri: expandHijri(hijri),
      _day: day,
      _month: month,
      _year: year,
      _dateObj: dateObj,
      imsak: parseJakimTime(imsak),
      fajr: parseJakimTime(fajr),
      syuruk: parseJakimTime(syuruk),
      dhuhr: parseJakimTime(dhuhr),
      asr: parseJakimTime(asr),
      maghrib: parseJakimTime(maghrib),
      isha: parseJakimTime(isha),
    };
  });
}

function loadData() {
  prayerData = buildPrayerData();
  renderAll();
}



// ============================================================
// GET TODAY'S DATA
// ============================================================
function getTodayEntry() {
  if (!prayerData || prayerData.length === 0) return null;
  const now = new Date();
  const d = now.getDate(), m = now.getMonth() + 1, y = now.getFullYear();
  for (const entry of prayerData) {
    if (entry._day === d && entry._month === m && entry._year === y) return entry;
  }
  return null;
}

function normEntry(entry) {
  return {
    imsak:   entry.imsak,
    fajr:    entry.fajr,
    syuruk:  entry.syuruk,
    dhuhr:   entry.dhuhr,
    asr:     entry.asr,
    maghrib: entry.maghrib,
    isha:    entry.isha,
    hijri:   entry.hijri || '',
    date:    entry.date  || '',
  };
}

// ============================================================
// RENDER
// ============================================================
function renderAll() {
  updateClock();
  if (currentTab === 'harian') renderDaily();
  else if (currentTab === 'mingguan') renderWeekly();
  else renderMonthly();
}

function renderDaily() {
  const entry = getTodayEntry();
  if (!entry) { document.getElementById('tabContent').innerHTML = '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.4)">Tiada data</div>'; return; }
  const p = normEntry(entry);
  const prayers = [
    { key: 'imsak',   ...PRAYER_META.imsak,   time: p.imsak },
    { key: 'fajr',    ...PRAYER_META.fajr,    time: p.fajr },
    { key: 'syuruk',  ...PRAYER_META.syuruk,  time: p.syuruk },
    { key: 'dhuhr',   ...PRAYER_META.dhuhr,   time: p.dhuhr },
    { key: 'asr',     ...PRAYER_META.asr,     time: p.asr },
    { key: 'maghrib', ...PRAYER_META.maghrib, time: p.maghrib },
    { key: 'isha',    ...PRAYER_META.isha,     time: p.isha },
  ];
  const activeKey = getActivePrayer(p);
  const nextObj   = getNextPrayer(p);
  const descs = {
    imsak:   '10 minit sebelum Subuh',
    fajr:    'Fajar mula terbit',
    syuruk:  'Matahari terbit — tamat waktu Subuh',
    dhuhr:   'Tengah hari',
    asr:     'Petang',
    maghrib: 'Matahari terbenam',
    isha:    'Malam',
  };
  let html = '<div class="prayer-list">';
  prayers.forEach(pr => {
    const isActive  = pr.key === activeKey;
    const isNext    = nextObj && pr.key === nextObj.key;
    const isDim     = pr.special && !isActive;
    const isAlarmOn = (alarmStates[pr.key] !== undefined ? alarmStates[pr.key] : pr.main) && alarmEnabled;
    let cardClass = 'prayer-card';
    if (isActive) cardClass += ' active-prayer';
    else if (isDim) cardClass += ' dim-card';
    html += `<div class="${cardClass}">
      <div class="p-left">
        <div class="p-icon">${pr.icon}</div>
        <div>
          <div class="p-name">${pr.ms}</div>
          <div class="p-desc">${descs[pr.key] || ''}</div>
        </div>
      </div>
      <div class="p-right">
        <div>
          <div class="p-time">${format12h(pr.time)}</div>
          ${isActive ? '<span class="now-badge">SEKARANG</span>' : ''}
          ${isNext && !isActive ? '<span class="next-badge">SETERUSNYA</span>' : ''}
        </div>
        <button class="alarm-btn ${isAlarmOn ? 'on' : ''}" onclick="togglePrayerAlarm('${pr.key}')">
          ${isAlarmOn ? '🔔' : '🔕'}
        </button>
      </div>
    </div>`;
  });
  html += '</div>';
  document.getElementById('tabContent').innerHTML = html;
  scheduleAlarms(p);
}


function getActivePrayer(p) {
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  const times = [
    { key: 'imsak',   min: timeToMinutes(p.imsak) },
    { key: 'fajr',    min: timeToMinutes(p.fajr) },
    { key: 'syuruk',  min: timeToMinutes(p.syuruk) },
    { key: 'dhuhr',   min: timeToMinutes(p.dhuhr) },
    { key: 'asr',     min: timeToMinutes(p.asr) },
    { key: 'maghrib', min: timeToMinutes(p.maghrib) },
    { key: 'isha',    min: timeToMinutes(p.isha) },
  ];
  
  let active = null;
  for (let i = 0; i < times.length; i++) {
    if (nowMin >= times[i].min) active = times[i].key;
  }
  return active;
}

function getNextPrayer(p) {
  const now = new Date();
  const nowMs = now.getTime();
  const todayDate = now.toDateString();
  
  const prayers = [
    { key: 'imsak',   ms: 'Imsak',   time: p.imsak },
    { key: 'fajr',    ms: 'Subuh',   time: p.fajr },
    { key: 'syuruk',  ms: 'Syuruk',  time: p.syuruk },
    { key: 'dhuhr',   ms: 'Zohor',   time: p.dhuhr },
    { key: 'asr',     ms: 'Asar',    time: p.asr },
    { key: 'maghrib', ms: 'Maghrib', time: p.maghrib },
    { key: 'isha',    ms: 'Isyak',   time: p.isha },
  ];
  
  for (const pr of prayers) {
    if (!pr.time) continue;
    const [h, m] = pr.time.split(':').map(Number);
    const pTime = new Date(now);
    pTime.setHours(h, m, 0, 0);
    if (pTime.getTime() > nowMs) {
      return { ...pr, targetMs: pTime.getTime() };
    }
  }
  return null;
}

function renderWeekly() {
  if (!prayerData) return;
  const now = new Date();
  const today = now.getDate();
  const dow = now.getDay();
  
  // Get this week (Mon-Sun)
  const weekStart = today - ((dow + 6) % 7);
  const rows = [];
  const nowM = now.getMonth() + 1, nowY = now.getFullYear();
  
  for (let d = weekStart; d <= weekStart + 6; d++) {
    const entry = prayerData.find(e => e._day === d && e._month === nowM && e._year === nowY);
    if (entry) rows.push({ d, entry, isToday: d === today });
  }
  
  document.getElementById('tabContent').innerHTML = renderTableHTML(rows);
}

function renderMonthly() {
  if (!prayerData) return;
  const now = new Date();
  const today = now.getDate();
  
  const nowM2 = now.getMonth() + 1, nowY2 = now.getFullYear();
  const rows = prayerData.filter(e => e._month === nowM2 && e._year === nowY2).map(e => ({ d: e._day, entry: e, isToday: e._day === today }));
  document.getElementById('tabContent').innerHTML = renderTableHTML(rows);
}

function renderTableHTML(rows) {
  let html = `<div class="table-wrap"><table>
    <thead><tr>
      <th>Hari/Tarikh</th>
      <th>Imsak</th>
      <th>Subuh</th>
      <th>Syuruk</th>
      <th>Zohor</th>
      <th>Asar</th>
      <th>Maghrib</th>
      <th>Isyak</th>
    </tr></thead>
    <tbody>`;
  
  rows.forEach(({ d, entry, isToday }) => {
    if (!entry) return;
    const p = normEntry(entry);
    const date = entry._dateObj || new Date(new Date().getFullYear(), new Date().getMonth(), d);
    const dayName = DAYS_MS[date.getDay()];
    html += `<tr class="${isToday ? 'today-row' : ''}">
      <td class="date-col">${dayName}<br><small>${String(d).padStart(2,'0')}/${String(entry._month||new Date().getMonth()+1).padStart(2,'0')}</small></td>
      <td>${format12h(p.imsak)}</td>
      <td>${format12h(p.fajr)}</td>
      <td>${format12h(p.syuruk)}</td>
      <td>${format12h(p.dhuhr)}</td>
      <td>${format12h(p.asr)}</td>
      <td>${format12h(p.maghrib)}</td>
      <td>${format12h(p.isha)}</td>
    </tr>`;
  });
  
  html += '</tbody></table></div>';
  return html;
}

// ============================================================
// CLOCK & COUNTDOWN
// ============================================================
function updateClock() {
  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes();
  const s = now.getSeconds();
  const ampm = h < 12 ? 'AM' : 'PM';
  const h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
  document.getElementById('clock').textContent = `${padZ(h12)}:${padZ(m)}:${padZ(s)} ${ampm}`;
  
  // Day & date
  document.getElementById('dayName').textContent = DAYS_MS[now.getDay()];
  document.getElementById('dateGreg').textContent = `${now.getDate()} ${MONTHS_MS[now.getMonth()]} ${now.getFullYear()}`;
  const todayEntry = getTodayEntry();
  document.getElementById('dateHijri').textContent = (todayEntry && todayEntry.hijri) ? todayEntry.hijri : getHijriDate(now);
  
  // Next prayer countdown
  const entry = getTodayEntry();
  if (entry) {
    const p = normEntry(entry);
    const next = getNextPrayer(p);
    if (next) {
      const remaining = next.targetMs - now.getTime();
      document.getElementById('nextName').textContent = next.ms;
      document.getElementById('nextTime').textContent = format12h(next.time);
      document.getElementById('countdown').textContent = formatCountdown(remaining);
    } else {
      document.getElementById('nextName').textContent = 'Isyak - Tamat';
      document.getElementById('countdown').textContent = '--:--:--';
    }
    
    // Check alarms every second
    checkAlarms(p, now);
  }
}

// ============================================================
// ALARMS & NOTIFICATIONS
// ============================================================
function checkAlarms(p, now) {
  const dateKey = now.toDateString();
  if (!firedToday[dateKey]) firedToday[dateKey] = {};
  
  const prayers = {
    imsak: p.imsak, fajr: p.fajr, syuruk: p.syuruk,
    dhuhr: p.dhuhr, asr: p.asr, maghrib: p.maghrib, isha: p.isha
  };
  
  const nowH = now.getHours(), nowM = now.getMinutes(), nowS = now.getSeconds();
  
  for (const [key, timeStr] of Object.entries(prayers)) {
    if (!timeStr || firedToday[dateKey][key]) continue;
    const isAlarmOn = (alarmStates[key] !== undefined ? alarmStates[key] : PRAYER_META[key]?.main) && alarmEnabled;
    if (!isAlarmOn) continue;
    
    const [h, m] = timeStr.split(':').map(Number);
    if (nowH === h && nowM === m && nowS === 0) {
      firedToday[dateKey][key] = true;
      fireAlarm(key);
    }
  }
}

function fireAlarm(key) {
  const meta = PRAYER_META[key];
  const name = meta?.ms || key;
  const msg = `🕌 Masuk waktu ${name}! اَللّٰهُ أَكْبَرُ`;
  
  // Browser notification
  if (browserNotifEnabled && 'Notification' in window && Notification.permission === 'granted') {
    new Notification(`Waktu ${name} - KTN01`, {
      body: msg,
      icon: 'icon-192.png',
      tag: key,
      requireInteraction: true,
    });
  }
  
  // Audio alarm
  playAzan(key);
  showToast(msg, 8000);
}

function playAzan(key) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    
    // Simple beep sequence as azan indicator
    const notes = key === 'fajr' ? [440,523,659,784,659,523,440] : [440,523,659,784];
    let time = ctx.currentTime;
    
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0, time);
      gain.gain.linearRampToValueAtTime(0.3, time + 0.05);
      gain.gain.linearRampToValueAtTime(0, time + 0.4);
      osc.start(time);
      osc.stop(time + 0.45);
      time += 0.5;
    });
  } catch {}
}

function scheduleAlarms(p) {
  // Just rely on the per-second check in checkAlarms
}

// ============================================================
// UI ACTIONS
// ============================================================
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    btn.classList.toggle('active', ['harian','mingguan','bulanan'][i] === tab);
  });
  
  if (tab === 'harian') renderDaily();
  else if (tab === 'mingguan') renderWeekly();
  else renderMonthly();
}

function toggleBrowserNotif() {
  if (!('Notification' in window)) {
    showToast('❌ Browser anda tidak menyokong notifikasi');
    return;
  }
  
  if (Notification.permission === 'denied') {
    showToast('❌ Notifikasi disekat. Sila benarkan dalam tetapan browser.');
    return;
  }
  
  if (Notification.permission === 'granted') {
    browserNotifEnabled = !browserNotifEnabled;
  } else {
    Notification.requestPermission().then(perm => {
      if (perm === 'granted') {
        browserNotifEnabled = true;
        updateNotifUI();
        showToast('✅ Notifikasi browser diaktifkan!');
      } else {
        showToast('❌ Kebenaran notifikasi ditolak.');
      }
    });
    return;
  }
  updateNotifUI();
  showToast(browserNotifEnabled ? '✅ Notifikasi browser aktif!' : '🔕 Notifikasi browser dimatikan.');
}

function toggleAlarms() {
  alarmEnabled = !alarmEnabled;
  document.getElementById('alarmBtn').classList.toggle('on', alarmEnabled);
  showToast(alarmEnabled ? '✅ Alarm azan diaktifkan!' : '🔕 Alarm azan dimatikan.');
  if (currentTab === 'harian') renderDaily();
}

function togglePrayerAlarm(key) {
  const current = alarmStates[key] !== undefined ? alarmStates[key] : PRAYER_META[key]?.main;
  alarmStates[key] = !current;
  if (currentTab === 'harian') renderDaily();
  showToast(alarmStates[key] ? `🔔 Alarm ${PRAYER_META[key]?.ms || key} diaktifkan` : `🔕 Alarm ${PRAYER_META[key]?.ms || key} dimatikan`);
}

function updateNotifUI() {
  const btn = document.getElementById('browserNotifBtn');
  btn.classList.toggle('on', browserNotifEnabled);
}
